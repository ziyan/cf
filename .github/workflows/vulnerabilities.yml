name: Vulnerabilities

# govulncheck against the current database, on a schedule rather than on every
# push. A vulnerability is found when somebody publishes it, not when somebody
# pushes a commit.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Reachability, not presence: govulncheck reports a vulnerability only
      # when this program actually calls the affected code.
      - name: Check
        env:
          GOFLAGS: -mod=vendor
        run: govulncheck ./...
