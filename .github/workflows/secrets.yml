name: Secrets

# gitleaks over the whole history, not the working tree: a secret removed in a
# later commit is still published, and a scanner that sees only the tip would
# call the repository clean.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Leaked secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # every commit, which is the whole point
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      # --redact keeps the secret out of a report that becomes a public alert.
      - name: Scan
        run: gitleaks git --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif --redact
      - name: Report
        if: always() && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
